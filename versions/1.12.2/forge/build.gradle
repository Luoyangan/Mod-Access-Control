// Minecraft 1.12.2 / Forge 14.23.5.2859 —— 使用 anatawa12 的 ForgeGradle 2.3 分支
// （兼容现代 Gradle，MCP mappings 直接从 forge maven 获取，无需 mcpbot）。
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.8'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group_id

// 输出名：模组名称-模组加载器-mc版本-模组版本
archivesBaseName = "${archives_base_name}-forge-${minecraft_version}"

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = 'run'
    mappings = mappings_channel
    makeObfSourceJar = false
}

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类，已兼容 Java 8）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}
