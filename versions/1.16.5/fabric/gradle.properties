# Gradle 内存
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / 映射：使用 Mojang 官方映射，保证与 Forge 适配层的 MC 类名一致
minecraft_version=1.16.5
# 统一使用官方映射（Loom 1.7.4：支持 Java 17 与 Gradle 8.10.x，与 1.20.1 Fabric 工程一致）
loom_version=1.7.4

# Fabric Loader（与 1.20.1 工程一致；0.14+ 在 1.16.5 上提供 slf4j）
loader_version=0.15.11
# Fabric API（1.16.5 线：0.42.0+1.16 的制品已从 maven.fabricmc.net 移除，0.41.3+1.16 可用）
fabric_version=0.41.3+1.16

# Mod 元数据
mod_id=mod_access_control
mod_name=Mod Access Control
mod_license=Apache-2.0
mod_version=1.1.1
maven_group=mcyszl.top
archives_base_name=mod-access-control
mod_authors=Luoyangan
mod_description=Client mod admission control for Minecraft servers. A unified two-phase handshake verifies protocol, loader, required mods and whitelist/blacklist policies across Forge / Fabric / NeoForge. (\u6A21\u7EC4\u51C6\u5165\u63A7\u5236)
