// Minecraft 1.16.5 / Forge 36.2.x —— ForgeGradle 4.1（官方 Mojang 映射，Java 8）
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group_id

// 输出名：模组名称-模组加载器-mc版本-模组版本
archivesBaseName = "${archives_base_name}-forge-${minecraft_version}"

sourceCompatibility = targetCompatibility = '1.8'

// FG 4.1.16 已移除 Map 形式的 mappings 重载，须用位置参数 mappings(channel, version)
def mappingsChannel = mapping_channel
def mappingsVersion = mapping_version

minecraft {
    mappings mappingsChannel, mappingsVersion
    runs {
        client {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类，已兼容 Java 8）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
    }
}

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
