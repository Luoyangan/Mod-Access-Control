# Gradle 配置
org.gradle.jvmargs=-Xmx3G
# MC 26.3 工具链要求 JVM 25+，指向本地 JDK 25
org.gradle.java.home=C\:/Users/Luoyangan/.gradle/jdks/jdk-25.0.4.1+1

# Minecraft
# 26.3 起游戏不再混淆，无需配置 mappings
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)

# Forge
forge_version=66.0.6
forge_version_range=[66,)
loader_version_range=[66,)

# ForgeGradle 7：合并 source sets（common 源码并入 main 时需要与 MDK 默认行为一致）
net.minecraftforge.gradle.merge-source-sets=true

# Mod 元数据
mod_id=mod_access_control
mod_name=Mod Access Control
archives_base_name=mod-access-control
mod_license=Apache-2.0
mod_version=1.0.3
mod_group_id=mcyszl.top
mod_authors=Luoyangan
mod_description=Client mod admission control for Minecraft servers. A unified two-phase handshake verifies protocol, loader, required mods and whitelist/blacklist policies across Forge / Fabric / NeoForge. (服务器准入控制)
