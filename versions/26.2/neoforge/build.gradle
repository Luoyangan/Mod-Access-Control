plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${mdg_version}"
}

group = mod_group_id
version = mod_version

base {
    // 输出名：模组名称-模组加载器-mc版本-模组版本
    archivesName = "${archives_base_name}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
        resources {
            srcDir '../../../common/src/main/resources'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// maven.neoforged.net（CDN77）在国内部分网络不可达，
// 清空 ModDevGradle 插件自动添加的仓库，改用 NeoForged 官方备用 CDN。
repositories.clear()
repositories {
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://neoforged.forgecdn.net/mojang-meta' }
    maven { url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

// NFRT（NeoFormRuntime）对 Gradle 生成的制品清单（manifest）之外的
// classifier 变体（如 binarypatcher 的 fatjar）会回退到内置仓库
// maven.neoforged.net 下载，而该域名被网络阻断。
// 这里从 forgecdn 解析缺失的 classifier 变体，注入 NFRT 制品清单。
configurations {
    nfrtToolArtifacts
}
dependencies {
    nfrtToolArtifacts 'net.neoforged.installertools:binarypatcher:4.0.17:fatjar'
}
tasks.named('createMinecraftArtifacts') {
    addArtifactsToManifest(configurations.nfrtToolArtifacts)
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
