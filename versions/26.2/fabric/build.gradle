plugins {
    // 26.1 起 Minecraft 去混淆，使用 loom 的 no-remap 入口（无需任何映射）。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // 输出名：模组名称-模组加载器-mc版本-模组版本
    archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet。
// 说明：26.1 起 Minecraft 去混淆，游戏 jar 即为 Mojang 官方命名，
// 因此 common 与适配层中的 net.minecraft.* 类名与 Forge / NeoForge 完全一致。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
        resources {
            srcDir '../../../common/src/main/resources'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 去混淆模式不注册 mod* 配置，loader 与 fabric-api 按普通库声明。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
