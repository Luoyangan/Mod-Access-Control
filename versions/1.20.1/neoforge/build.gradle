plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version "${mdg_version}"
}

group = mod_group_id
version = mod_version

base {
    // 输出名：模组名称-模组加载器-mc版本-模组版本
    archivesName = "${archives_base_name}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
        resources {
            srcDir '../../../common/src/main/resources'
        }
    }
}

// NeoGradle userdev：官方映射（official）为默认，无需配置 minecraft/mappings 块。

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:forge:${neo_version}"
}

processResources {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
