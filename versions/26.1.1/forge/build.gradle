plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

group = mod_group_id
version = mod_version

base {
    // 输出名：模组名称-模组加载器-mc版本-模组版本
    archivesName = "${archives_base_name}-forge-${minecraft_version}"
}

// Mojang 26.1+ 自带 Java 25，模组目标 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
        resources {
            srcDir '../../../common/src/main/resources'
        }
    }
}

// ForgeGradle 7：游戏自 26.1 起不再混淆，无 mappings 配置；runs 改为 register() DSL
minecraft {
    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client') {
            workingDir = layout.projectDirectory.dir('run-client')
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'Local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
