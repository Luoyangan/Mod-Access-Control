plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${mdg_version}"
}

group = mod_group_id
version = mod_version

base {
    // 输出名：模组名称-模组加载器-mc版本-模组版本
    archivesName = "${archives_base_name}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 跨加载器共享核心：直接把 common 源码并入本工程的 main sourceSet，
// 编译进同一个 jar（common 不依赖任何加载器/Minecraft 类）。
sourceSets {
    main {
        java {
            srcDir '../../../common/src/main/java'
        }
        resources {
            srcDir '../../../common/src/main/resources'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Local mirror seeded from the Gradle cache: hosts neoform-runtime etc.
    // that the unreachable maven.neoforged.net would normally provide.
    maven {
        url = new File(rootDir, '../../../local-maven').canonicalFile.toURI()
        // Gradle 9 skips Gradle module metadata lookup for some repos; force it
        // so the module-only artifacts (neoform, minecraft-dependencies) resolve.
        metadataSources { gradleMetadata(); mavenPom() }
    }
    mavenCentral()
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// maven.neoforged.net is unreachable from this network, so MDG-added repos are
// redirected to the BMCLAPI mirror (path-compatible with /releases).
afterEvaluate {
    repositories.each { repo ->
        try {
            def u = repo.url?.toString() ?: ''
            if (u.contains('maven.neoforged.net')) {
                repo.url = uri('https://mirrors.nyist.edu.cn/bmclapi')
            }
        } catch (ignored) {
        }
    }
}