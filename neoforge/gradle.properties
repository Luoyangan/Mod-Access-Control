# Gradle 内存与守护进程
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv6Addresses=true
org.gradle.daemon=false

# 本机到 maven.neoforged.net 的 IPv4 通路被重置，仅 IPv6 可用；强制解析优先走 IPv6
systemProp.java.net.preferIPv6Addresses=true

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge（该版本由官方 maven-metadata 实测确认）
neo_version=21.1.250
neo_version_range=[21.1,)
loader_version_range=[4,)

# ModDevGradle（net.neoforged.moddev，官方 maven 实测存在的版本）
mdg_version=2.0.78

# Mod 元数据（与 Forge / Fabric 产物保持一致，保证跨加载器同协议、同规则）
mod_id=mod_access_control
mod_name=Mod Access Control
mod_license=GNU GPL 3.0
mod_version=1.0.0
mod_group_id=mcyszl.top
mod_authors=MCYSZL
mod_description=Client mod admission control for Minecraft servers. A unified two-phase handshake verifies protocol, loader, required mods and whitelist/blacklist policies across Forge / Fabric / NeoForge. (模组准入控制)
